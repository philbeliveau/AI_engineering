events {
    worker_connections 1024;
}

http {
    # Logging to stdout/stderr for Railway
    access_log /dev/stdout;
    error_log /dev/stderr;

    upstream streamlit {
        server 127.0.0.1:8501;
    }

    upstream api {
        server 127.0.0.1:8000;
    }

    server {
        # PORT is substituted by envsubst in start.sh
        listen $PORT;

        # API endpoints -> FastAPI
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Project-ID $http_x_project_id;
        }

        # Health check for Railway (hits FastAPI directly)
        location = /health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
        }

        # Everything else -> Streamlit
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Streamlit websocket
        location /_stcore/stream {
            proxy_pass http://streamlit/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
}
